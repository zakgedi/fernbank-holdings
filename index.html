<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#163D2E">
<meta name="description" content="A venture fund of funds built around 10-12 long-term partnerships.">
<title>Fernbank Holdings</title>
<style>
:root{--forest:#163D2E;--dark:#0D2A20;--mid:#285742;--light:#7F9C88;--white:#F4F1E8}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--forest);color:var(--white);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100svh;display:flex;flex-direction:column;padding:40px 48px 32px;overflow:hidden}header{display:flex;align-items:start;justify-content:space-between;gap:24px}.wordmark{font-size:24px;font-weight:400;line-height:1.04;letter-spacing:-1px}.category{font-size:11px;line-height:1.4;letter-spacing:.04em;padding-top:3px}
.hero{flex:1;display:grid;grid-template-columns:1.55fr 1fr;align-items:center;gap:60px;padding:96px 0 100px}h1{font-size:clamp(42px,5.05vw,76px);line-height:1.06;letter-spacing:-.055em;font-weight:400;margin:0;max-width:790px}p{font-size:15px;line-height:1.65;margin:34px 0 0;max-width:355px;color:var(--white)}
.mark{width:100%;max-width:390px;aspect-ratio:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;justify-self:end}.mark span:nth-child(1){background:var(--light)}.mark span:nth-child(2){background:var(--mid)}.mark span:nth-child(3){background:var(--mid)}.mark span:nth-child(4){background:var(--dark)}.mark span{position:relative}.mark span:nth-child(1)::after{content:"";position:absolute;inset:50% 0 0 50%;background:var(--forest)}.mark span:nth-child(4)::after{content:"";position:absolute;inset:0 50% 50% 0;background:var(--forest)}
footer{border-top:1px solid #567460;padding-top:18px;font-size:11px;line-height:1.5;color:#BCCABC}
@media(max-width:760px){main{padding:28px 24px 24px}.wordmark{font-size:22px}.category{font-size:10px;max-width:90px;text-align:right}.hero{grid-template-columns:1fr;gap:60px;padding:90px 0 60px}h1{font-size:clamp(39px,7.8vw,58px);max-width:590px}p{font-size:14px;max-width:320px;margin-top:28px}.mark{width:56%;max-width:230px;justify-self:end}footer{font-size:10px}}
@media(min-width:1600px){main{padding:56px 64px 40px}.hero{gap:110px}.mark{max-width:460px}}
</style>
</head>
<body>
<main>
<header><div class="wordmark">Fernbank<br>Holdings</div><div class="category">Venture fund of funds</div></header>
<section class="hero"><div><h1>A lasting partner to the next great technology investors.</h1><p>A venture fund of funds built around 10-12 long-term partnerships.</p></div><div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div></section>
<footer>Fernbank Holdings</footer>
</main>
</body>
</html>
